name: Fehler melden
description: Etwas funktioniert nicht wie erwartet.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Bitte keine Einladungslinks, Wiederherstellungscodes oder andere Schlüssel posten.
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zur Reproduktion
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Was hast du erwartet?
  - type: input
    id: umgebung
    attributes:
      label: Gerät, Browser, App-Version
      placeholder: z. B. Pixel 7, Chrome 142, installierte PWA, v0.3.0
