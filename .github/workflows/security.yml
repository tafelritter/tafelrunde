name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
          # AGPL-3.0-kompatible Lizenzen; deckungsgleich mit tools/check-licenses.mjs
          allow-licenses: >-
            0BSD, AGPL-3.0-only, AGPL-3.0-or-later, Apache-2.0, BlueOak-1.0.0,
            BSD-2-Clause, BSD-3-Clause, CC0-1.0, CC-BY-4.0, ISC, LGPL-3.0-or-later,
            MIT, MPL-2.0, Python-2.0, Unlicense, Zlib
          # Fehlerkennungen der Lizenz-Analyse (scancode), beide nur Build-/Testwerkzeuge:
          # - unicode-match-property-value-ecmascript (Babel): package.json MIT, Daten unter
          #   der Unicode-Lizenz (permissiv, GPL-kompatibel)
          # - uri-js (ajv/ESLint, workbox-build): package.json BSD-2-Clause; erkannt wird
          #   zusätzlich BSD-2-Clause-Views (permissiv)
          allow-dependencies-licenses: >-
            pkg:npm/unicode-match-property-value-ecmascript,
            pkg:npm/uri-js
          comment-summary-in-pr: on-failure

  osv-scanner:
    name: OSV-Scanner
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
